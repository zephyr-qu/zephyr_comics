[package]
name = "rust_lib_zephyr_comics"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# FFI - flutter_rust_bridge
flutter_rust_bridge = "=2.12.0"

# 错误处理
thiserror = "1.0"

# 压缩格式支持 (CBZ/ZIP)
zip = "0.6"

# 图像：仅用于读取页面尺寸与生成封面缩略图，不做页面解码
image = "0.24"

# 日志
log = "0.4"

# 数据库 (书架/进度管理)
rusqlite = { version = "0.31", features = ["bundled"] }

# 元数据解析
quick-xml = "0.31"

# 异步运行时 (FRB 需要)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

# 工具
once_cell = "1.19"

# 日志 (非 Android 平台)
[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"

# Android 日志
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
